<main class="app-shell">
  <header class="page-header">
    <div>
      <p class="eyebrow">TEAM PLANNER</p>
      <h1>{{ scheduleView() === 'week' ? 'Weekly schedule' : 'Monthly schedule' }}</h1>
      <p class="intro">Plan your team's schedule and keep every shift covered.</p>
    </div>
    <button class="today-button" type="button" (click)="goToToday()">Today</button>
  </header>

  @if (errorMessage()) {
    <p class="notification error-message" role="alert">{{ errorMessage() }}</p>
  }
  @if (successMessage()) {
    <p class="notification success-message" role="status">{{ successMessage() }}</p>
  }

  <app-schedule-calendar
    [days]="displayedDays()"
    [employees]="employees()"
    [shifts]="shifts()"
    [loading]="loading()"
    [busyShiftId]="busyShiftId()"
    [scheduleLabel]="scheduleLabel()"
    [scheduleView]="scheduleView()"
    [viewDate]="viewDate()"
    (viewChange)="setScheduleView($event)"
    (navigate)="moveWeek($event)"
    (addShift)="newShiftFor($event)"
    (editShift)="editShift($event)"
    (removeShift)="deleteShift($event)"
  />

  <div class="management-grid">
    <app-employee-management
      [employees]="employees()"
      [employeeForm]="employeeForm"
      [editingEmployeeId]="editingEmployeeId()"
      [savingEmployee]="savingEmployee()"
      [busyEmployeeId]="busyEmployeeId()"
      (save)="saveEmployee()"
      (cancelEdit)="cancelEmployeeEdit()"
      (startEdit)="startEmployeeEdit($event)"
      (remove)="deleteEmployee($event)"
    />
    <app-shift-assignment
      [employees]="employees()"
      [shiftForm]="shiftForm"
      [editingShiftId]="editingShiftId()"
      [savingShift]="savingShift()"
      (save)="saveShift()"
      (cancelEdit)="cancelShiftEdit()"
    />
  </div>
</main>
